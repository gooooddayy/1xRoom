<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>P2P 实时共享聊天室</title>
<style>
/* ============ 设计变量 ============ */
:root{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --line:#e6e9f0;
  --line-strong:#d6dbe6;
  --text:#1b1f2a;
  --text-2:#5b657a;
  --text-3:#8e98ab;
  --accent:#5b62f4;
  --accent-2:#7c6cf7;
  --accent-soft:#eef0ff;
  --ok:#10b981;
  --warn:#f59e0b;
  --err:#ef4444;
  --radius:14px;
  --radius-lg:20px;
  --shadow-s:0 1px 2px rgba(20,24,40,.05),0 1px 3px rgba(20,24,40,.04);
  --shadow-m:0 4px 12px rgba(20,24,40,.07),0 1px 3px rgba(20,24,40,.05);
  --shadow-l:0 18px 50px rgba(20,24,40,.16);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;
  overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfd5e2;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#b9c1d3}
::-webkit-scrollbar-track{background:transparent}

/* ============ 通用动画 ============ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}

/* ============ 登录 / 房间面板 ============ */
#gate{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(900px 500px at 12% 8%,#e5e8ff 0%,transparent 60%),
    radial-gradient(700px 500px at 88% 92%,#e2f5ef 0%,transparent 60%),
    var(--bg);
  animation:fadeIn .4s var(--ease);
}
#gate.hide{opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.gate-card{
  width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);
  border-radius:24px;box-shadow:var(--shadow-l);padding:32px 28px;animation:popIn .5s var(--ease);
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.brand .dot{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(91,98,244,.32);
}
.brand .dot svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--text-3)}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.field .ipt{
  width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface-2);
  outline:none;transition:border-color .2s,background .2s,box-shadow .2s;
}
.field .ipt:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface-2);padding:5px;border-radius:13px;border:1px solid var(--line);margin-bottom:16px}
.seg button{padding:9px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);transition:all .25s var(--ease)}
.seg button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow-s)}
.btn{
  width:100%;padding:13px;border-radius:12px;font-size:14.5px;font-weight:650;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 6px 18px rgba(91,98,244,.3);transition:transform .18s var(--ease),box-shadow .18s,filter .18s;
}
.btn:hover{transform:translateY(-1.5px);box-shadow:0 10px 24px rgba(91,98,244,.36)}
.btn:active{transform:translateY(0) scale(.99)}
.btn[disabled]{filter:grayscale(.5) opacity(.6);pointer-events:none}
.btn .ld{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:-2px}
.btn.busy .ld{display:inline-block}
.tip{margin:16px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.7}
.gate-err{
  display:none;margin-top:14px;padding:10px 12px;border-radius:10px;font-size:12.5px;
  background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;animation:shake .4s;
}
.gate-err.show{display:block}

/* ============ 主体布局 ============ */
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex;animation:fadeIn .5s var(--ease)}

header{
  flex:none;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:20;
}
.hd-logo{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center}
.hd-logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hd-title{font-weight:650;font-size:14.5px;white-space:nowrap}
.room-chip{
  display:flex;align-items:center;gap:8px;padding:6px 8px 6px 11px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:99px;min-width:0;
}
.room-chip .lb{font-size:11px;color:var(--text-3);flex:none}
.room-chip .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.icon-btn{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--text-2);transition:background .18s,color .18s,transform .18s var(--ease);
}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);padding:5px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none;transition:background .3s}
.status.ok .led{background:var(--ok);animation:pulseRing 2.4s infinite}
.status.warn .led{background:var(--warn)}
.status.err .led{background:var(--err)}

main{flex:1;display:flex;min-height:0;overflow:hidden}

/* 侧栏：在线用户 */
aside{
  width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.aside-hd{flex:none;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
.aside-hd h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.count-pill{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px}
#users{flex:1;overflow-y:auto;padding:0 8px 12px}
.user{
  display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:11px;margin-bottom:2px;
  animation:slideL .35s var(--ease);transition:background .18s;
}
.user:hover{background:var(--surface-2)}
.avatar{
  width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;position:relative;
}
.avatar.speaking{animation:pulseRing 1.2s infinite}
.user-meta{min-width:0;flex:1}
.user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-sub{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;line-height:1.5}
.tag.host{background:#fff7ed;color:#c2620a}
.tag.me{background:var(--accent-soft);color:var(--accent)}
.mic-ico{width:14px;height:14px;flex:none;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mic-ico.on{stroke:var(--ok)}
.mic-ico.off{stroke:var(--text-3)}
.mic-ico.hidden{display:none}
.wave{display:none;align-items:flex-end;gap:1.5px;height:11px}
.wave.on{display:flex}
.wave i{width:2px;background:var(--ok);border-radius:2px;height:100%;transform-origin:bottom;animation:bar .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}
.wave i:nth-child(3){animation-delay:.3s}
.wave i:nth-child(4){animation-delay:.45s}

/* 中间：播放区 + 聊天 */
.center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

#stage{
  flex:none;display:none;background:#0d1017;border-bottom:1px solid var(--line);position:relative;
  animation:slideUp .4s var(--ease);
}
#stage.on{display:block}
.stage-bar{
  position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;
  padding:9px 12px;color:#fff;font-size:12px;
  background:linear-gradient(180deg,rgba(0,0,0,.6),transparent);pointer-events:none;
}
.stage-bar .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{
  display:inline-flex;align-items:center;gap:5px;background:#ef4444;color:#fff;
  font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;flex:none;
}
.live b{width:5px;height:5px;background:#fff;border-radius:50%;animation:fadeIn 1s infinite alternate}
.stage-bar .btns{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.stage-bar .btns button{
  padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);transition:background .18s
}
.stage-bar .btns button:hover{background:rgba(255,255,255,.3)}
#stageVideo{display:block;width:100%;max-height:44vh;background:#000;aspect-ratio:16/9;object-fit:contain}
#stageFrame{display:none;width:100%;aspect-ratio:16/9;max-height:44vh;border:0;background:#000}
#stage.frame #stageVideo{display:none}
#stage.frame #stageFrame{display:block}

#msgs{flex:1;overflow-y:auto;padding:18px 18px 8px;scroll-behavior:smooth}
.day{text-align:center;margin:6px 0 16px}
.day span{font-size:11px;color:var(--text-3);background:var(--surface);border:1px solid var(--line);padding:3px 12px;border-radius:99px}
.sys{text-align:center;margin:10px 0;animation:fadeIn .4s var(--ease)}
.sys span{font-size:11.5px;color:var(--text-3);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:99px}
.row{display:flex;gap:9px;margin-bottom:14px;animation:slideUp .35s var(--ease)}
.row.me{flex-direction:row-reverse}
.row .bd{max-width:min(560px,74%);min-width:0}
.row.me .bd{display:flex;flex-direction:column;align-items:flex-end}
.mhd{display:flex;align-items:baseline;gap:7px;margin-bottom:4px;padding:0 2px}
.row.me .mhd{flex-direction:row-reverse}
.mhd .nm{font-size:12px;font-weight:650;color:var(--text-2)}
.mhd .tm{font-size:10.5px;color:var(--text-3)}
.bub{
  padding:9px 13px;border-radius:16px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-s);word-break:break-word;white-space:pre-wrap;line-height:1.65;
  border-top-left-radius:5px;
}
.row.me .bub{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;
  border-top-left-radius:16px;border-top-right-radius:5px;box-shadow:0 4px 14px rgba(91,98,244,.26);
}
.bub a{color:var(--accent);text-decoration:underline}
.row.me .bub a{color:#fff}
.bub.plain{padding:0;background:none;border:none;box-shadow:none}
.img-msg{
  display:block;max-width:100%;max-height:280px;border-radius:14px;cursor:zoom-in;border:1px solid var(--line);
  transition:transform .25s var(--ease),box-shadow .25s;background:var(--surface-2);
}
.img-msg:hover{transform:scale(1.015);box-shadow:var(--shadow-m)}
.vcard{
  width:min(480px,100%);border-radius:14px;overflow:hidden;background:#0d1017;border:1px solid var(--line);
  box-shadow:var(--shadow-m);
}
.vcard video,.vcard iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
.vcard .ft{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border-top:1px solid var(--line)}
.vcard .ft .src{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:5px;flex:none}
.vcard .ft .u{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.vcard .ft button{
  flex:none;font-size:11px;font-weight:650;color:var(--accent);background:var(--accent-soft);
  padding:4px 9px;border-radius:7px;transition:background .18s,transform .18s
}
.vcard .ft button:hover{background:#e2e5ff}
.vcard .ft button:active{transform:scale(.94)}

/* 底部输入 */
footer{
  flex:none;padding:10px 14px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.composer{display:flex;align-items:flex-end;gap:8px;max-width:1100px;margin:0 auto}
.tools{display:flex;gap:4px;flex:none}
.tool{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);
  background:var(--surface-2);border:1px solid var(--line);
  transition:all .2s var(--ease);position:relative;
}
.tool:hover{color:var(--accent);border-color:#c9cdf8;background:var(--accent-soft);transform:translateY(-1px)}
.tool:active{transform:scale(.93)}
.tool svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(91,98,244,.3)}
.tool.danger.active{background:var(--err);border-color:var(--err);box-shadow:0 4px 12px rgba(239,68,68,.3)}
.tool.muted{background:var(--warn);border-color:var(--warn);color:#fff}
.tool .badge{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid #fff;display:none}
.tool.active .badge{display:block}
.inwrap{flex:1;display:flex;align-items:flex-end;background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:14px;padding:4px 4px 4px 12px;transition:border-color .2s,box-shadow .2s,background .2s}
.inwrap:focus-within{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
#input{
  flex:1;border:none;background:none;outline:none;resize:none;padding:8px 0;max-height:120px;
  line-height:1.6;min-height:22px;
}
#send{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  transition:transform .2s var(--ease),filter .2s;box-shadow:0 3px 10px rgba(91,98,244,.3)
}
#send svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#send:hover{transform:scale(1.07)}
#send:active{transform:scale(.92)}
#send.off{filter:grayscale(1) opacity(.4);pointer-events:none;box-shadow:none}
.hintbar{max-width:1100px;margin:7px auto 0;font-size:11px;color:var(--text-3);display:flex;gap:14px;flex-wrap:wrap}
.hintbar kbd{font-family:inherit;background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:10.5px}

/* 移动端抽屉 */
#drawerBtn{display:none}
.mask{position:fixed;inset:0;background:rgba(16,20,32,.4);z-index:29;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.mask.on{opacity:1;pointer-events:auto}

/* 图片灯箱 */
#lightbox{position:fixed;inset:0;z-index:120;background:rgba(10,12,20,.9);display:none;place-items:center;padding:24px;animation:fadeIn .25s;cursor:zoom-out}
#lightbox.on{display:grid}
#lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:var(--shadow-l);animation:popIn .35s var(--ease)}
#lightbox .close{position:absolute;top:16px;right:18px;color:#fff;font-size:26px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14)}

/* Toast */
#toasts{position:fixed;top:70px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:11px;box-shadow:var(--shadow-m);font-size:13px;
  animation:slideR .35s var(--ease);max-width:300px;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast.out{opacity:0;transform:translateX(16px);transition:all .35s var(--ease)}

/* ============ 文件消息卡片 ============ */
.vcard audio{display:block;width:100%;background:#0d1017}
.fcard{
  display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:14px;max-width:min(440px,100%);flex-wrap:wrap;
}
.row.me .fcard{background:#eef0ff;border-color:#cfd3fb}
.f-ico{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:var(--accent-soft);font-size:21px;border:1px solid var(--line)}
.f-meta{min-width:0;flex:1;min-width:150px}
.f-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.f-sub{font-size:11px;color:var(--text-3);margin-top:1px}
.f-kind{color:var(--accent);font-weight:700}
.f-prog{display:flex;align-items:center;gap:7px;margin-top:6px}
.f-bar{flex:1;height:5px;background:#e2e6f0;border-radius:99px;overflow:hidden;min-width:90px}
.f-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .2s var(--ease)}
.f-pct{font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums;min-width:30px}
.f-acts{display:flex;gap:6px;flex:none}
.f-acts button,.f-acts a{
  font-size:11.5px;font-weight:650;padding:5px 11px;border-radius:8px;text-decoration:none;
  background:var(--accent);color:#fff;transition:opacity .18s,transform .18s;white-space:nowrap;
}
.f-acts button{background:var(--accent-soft);color:var(--accent)}
.f-acts button:hover,.f-acts a:hover{transform:translateY(-1px)}
.f-acts button:active,.f-acts a:active{transform:scale(.95)}
.f-acts button[disabled]{opacity:.4;pointer-events:none}
.f-thumb{width:100%;flex-basis:100%;margin-top:9px;max-height:240px;border-radius:11px;cursor:zoom-in;
  border:1px solid var(--line);object-fit:cover;transition:transform .25s var(--ease)}
.f-thumb:hover{transform:scale(1.012)}

/* ============ 文件预览弹窗 ============ */
#previewModal{position:fixed;inset:0;z-index:140;background:rgba(10,12,20,.88);
  display:none;align-items:stretch;justify-content:center;animation:fadeIn .25s;padding:0}
#previewModal.on{display:flex}
.pm{width:100%;max-width:980px;display:flex;flex-direction:column;background:var(--surface);

<input type="file" id="filePick" accept="image/*" hidden>

<div id="audioSink" style="display:none"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* =========================================================================
   P2P 实时共享聊天室
   - 信令：PeerJS 公共服务器（仅握手）
   - 业务数据：RTCDataChannel / RTCPeerConnection 点对点直传
   - 拓扑：全网状（房主为发现协调者，房主 Peer ID = 房间号）
   ========================================================================= */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const fmtTime = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

/* ---------------- 全局状态 ---------------- */
const S = {
  peer: null,
  myId: null,
  nickname: '',
  isHost: false,
  roomId: null,
  entered: false,
  conns: new Map(),        // peerId -> { conn, nickname, voice:{active,muted}, speaking }
  roster: new Set(),       // 进房时已存在的成员（用于抑制"加入"提示）
  voiceStream: null,       // 本机麦克风流
  voiceMuted: false,
  shareStream: null,       // 本机共享的视频流
  voiceCalls: new Map(),   // peerId -> MediaConnection（外发语音）
  shareCalls: new Map(),   // peerId -> MediaConnection（外发视频共享）
  audios: new Map(),       // peerId -> <audio>
  detectors: new Map(),    // peerId -> stop()
  stage: { owner: null, mode: null, url: '' }, // mode: 'p2p' | 'video' | 'frame'
  shareObjUrl: null,
  selfSpeaking: false,
  syncLock: 0,
  transfers: new Map()    // fileId -> 文件传输状态（含进度、本地 Blob URL）
};

/* ---------------- UI 工具 ---------------- */
function toast(msg, kind = 'info', ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, ms);
}
function setStatus(kind, text) {
  const el = $('#status');
  el.className = 'status ' + kind;
  el.querySelector('.txt').textContent = text;
}
function gateErr(msg) {
  const el = $('#gateErr');
  el.textContent = msg;
  el.classList.add('show');
  $('#goBtn').classList.remove('busy');
  $('#goBtn').disabled = false;
}
function colorOf(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
  return `linear-gradient(135deg,hsl(${h} 62% 56%),hsl(${(h + 32) % 360} 62% 48%))`;
}

/* ---------------- 登录面板 ---------------- */
let gateMode = 'create';
document.querySelectorAll('.seg button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.seg button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    gateMode = b.dataset.mode;
    $('#joinField').style.display = gateMode === 'join' ? '' : 'none';
    $('#goBtn .tx').textContent = gateMode === 'join' ? '加入房间' : '创建房间并进入';
    $('#gateErr').classList.remove('show');
  };
});
$('#nick').addEventListener('keydown', e => { if (e.key === 'Enter') $('#goBtn').click(); });
$('#roomIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#goBtn').click(); });

$('#goBtn').onclick = async () => {
  const nick = $('#nick').value.trim();
  if (!nick) { gateErr('请先输入昵称'); $('#nick').focus(); return; }
  const room = $('#roomIn').value.trim();
  if (gateMode === 'join' && !room) { gateErr('请输入要加入的房间号'); $('#roomIn').focus(); return; }
  S.nickname = nick;
  $('#gateErr').classList.remove('show');
  $('#goBtn').classList.add('busy');
  $('#goBtn').disabled = true;
  if (!await ensurePeerLib()) { gateErr('WebRTC 依赖加载失败，请检查网络或稍后重试'); return; }
  if (gateMode === 'create') startHost(); else startGuest(room);
};

/* PeerJS 依赖：主源失败自动切换备用 CDN */
const PEER_CDNS = [
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://fastly.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'
];
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
}
async function ensurePeerLib() {
  if (typeof Peer !== 'undefined') return true;
  for (const u of PEER_CDNS) {
    try { await loadScript(u); if (typeof Peer !== 'undefined') return true; } catch (e) { }
  }
  return false;
}

/* 预览依赖：按需懒加载，多 CDN 兜底（hls.js / mammoth / SheetJS / JSZip） */
const LIBS = {
  hls: ['https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js',
        'https://fastly.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js'],
  mammoth: ['https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
            'https://fastly.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js'],
  xlsx: ['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
         'https://cdn.sheetjs.com/xlsx-0.18.5/dist/xlsx.full.min.js'],
  jszip: ['https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
          'https://fastly.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js']
};
const libCache = {};
function ensureLib(key) {
  if (libCache[key]) return libCache[key];
  const urls = LIBS[key] || [];
  const g = { hls: 'Hls', mammoth: 'mammoth', xlsx: 'XLSX', jszip: 'JSZip' }[key];
  libCache[key] = (async () => {
    for (const u of urls) {
      try {
        await loadScript(u);
        if (!g || typeof window[g] !== 'undefined') return window[g];
      } catch (e) { }
    }
    throw new Error('预览依赖加载失败：' + key);
  })();
  return libCache[key];
}

/* ---------------- PeerJS 初始化 ---------------- */
const ICE = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:global.stun.twilio.com:3478' }
  ],
  sdpSemantics: 'unified-plan'
};
const newPeer = id => new Peer(id, { debug: 1, config: ICE });
const genRoom = () => 'rm' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);

let idRetry = 0;
function startHost() {
  S.isHost = true;
  S.roomId = genRoom();
  S.peer = newPeer(S.roomId);
  bindPeer();
}
function startGuest(room) {
  S.isHost = false;
  S.roomId = room;
  S.peer = newPeer(undefined);
  bindPeer();
}

function bindPeer() {
  const p = S.peer;
  p.on('open', id => {
    S.myId = id;
    if (S.isHost) { S.roomId = id; enterRoom(); }
    else { S.roster.add(S.roomId); connectTo(S.roomId); }
  });
  p.on('connection', conn => setupConn(conn));
  p.on('call', handleCall);
  p.on('error', onPeerError);
  p.on('disconnected', () => {
    setStatus('warn', '重连中');
    try { p.reconnect(); } catch (e) { }
  });
  p.on('close', () => setStatus('err', '已断开'));
}

function onPeerError(err) {
  const t = err.type || '';
  console.warn('[peer error]', t, err);
  if (t === 'unavailable-id' && S.isHost && idRetry < 4) {
    idRetry++;
    S.roomId = genRoom();
    try { S.peer.destroy(); } catch (e) { }
    S.peer = newPeer(S.roomId);
    bindPeer();
    return;
  }
  const map = {
    'peer-unavailable': '找不到该房间，请确认房间号是否正确、房主是否仍在线',
    'network': '无法连接信令服务器，请检查网络后重试',
    'server-error': '公共信令服务器暂时不可用，请稍后重试',
    'unavailable-id': '房间号被占用，请重试',
    'browser-incompatible': '当前浏览器不支持 WebRTC，请换用 Chrome / Edge / Safari',
    'ssl-unavailable': '需在 https 或 localhost 环境下运行',
    'webrtc': 'WebRTC 连接异常，请重试'
  };
  const msg = map[t] || ('连接出错：' + (err.message || t));
  if (!S.entered) gateErr(msg);
  else {
    // 与单个成员连接失败不影响整体
    if (t === 'peer-unavailable') return;
    toast(msg, 'err', 5000);
    setStatus('warn', '网络异常');
  }
}

/* ---------------- 连接与房间管理 ---------------- */
function connectTo(peerId) {
  if (!peerId || peerId === S.myId || S.conns.has(peerId)) return;
  // 使用默认 binary 序列化：PeerJS 会对超过 MTU 的数据（如 base64 图片）自动分片重组
  const conn = S.peer.connect(peerId, { reliable: true, metadata: { nickname: S.nickname } });
  setupConn(conn);
}

function setupConn(conn) {
  let opened = false;
  conn.on('open', () => {
    opened = true;
    if (!S.conns.has(conn.peer)) {
      S.conns.set(conn.peer, { conn, nickname: (conn.metadata && conn.metadata.nickname) || '成员', voice: { active: false, muted: false }, speaking: false });
    } else {
      S.conns.get(conn.peer).conn = conn;
    }
    send(conn, { sys: 'hello', nickname: S.nickname, host: S.isHost });
    if (!S.entered) enterRoom();
    setStatus('ok', '已连接');
    renderUsers();
    // 若我已有进行中的媒体，补发给新成员
    if (S.voiceStream) callPeer(conn.peer, 'voice');
    if (S.shareStream) callPeer(conn.peer, 'share');
    // 若我是共享区发起者且是链接播放，同步给新成员
    if (S.stage.owner === S.myId && S.stage.mode !== 'p2p' && S.stage.url) {
      send(conn, { sys: 'stageLink', url: S.stage.url, mode: S.stage.mode, embed: S.stage.embed, nickname: S.nickname });
    }
  });
  conn.on('data', d => onData(conn.peer, d));
  conn.on('close', () => dropPeer(conn.peer));
  conn.on('error', e => { console.warn('[conn error]', conn.peer, e); if (!opened) dropPeer(conn.peer, true); });
}

function send(conn, obj) { try { if (conn && conn.open) conn.send(obj); } catch (e) { console.warn(e); } }
function broadcast(obj) { S.conns.forEach(o => send(o.conn, obj)); }

function enterRoom() {
  if (S.entered) return;
  S.entered = true;
  $('#roomId').textContent = S.roomId;
  $('#gate').classList.add('hide');
  setTimeout(() => { $('#gate').style.display = 'none'; }, 460);
  $('#app').classList.add('on');
  setStatus(S.isHost ? 'ok' : 'ok', S.isHost ? '房间已就绪' : '已连接');
  renderUsers();
  sysMsg(S.isHost ? '房间创建成功，把房间号分享给朋友即可开始' : '已加入房间');
  if (S.isHost) toast('房间已创建，点击顶部复制房间号分享', 'ok', 4200);
  setTimeout(() => $('#input').focus(), 500);
}

function dropPeer(peerId, silent) {
  const info = S.conns.get(peerId);
  if (!info) return;
  S.conns.delete(peerId);
  // 清理媒体
  closeCall(S.voiceCalls, peerId);
  closeCall(S.shareCalls, peerId);
  removeAudio(peerId);
  stopDetector(peerId);
  if (S.stage.owner === peerId) clearStage(true);
  if (!silent) sysMsg(`${info.nickname} 离开了房间`);
  renderUsers();
  if (S.conns.size === 0) setStatus('warn', '房间内仅你一人');
}
function closeCall(map, peerId) {
  const c = map.get(peerId);
  if (c) { try { c.close(); } catch (e) { } map.delete(peerId); }
}

function onData(peerId, d) {
  if (!d || typeof d !== 'object') return;
  if (d.sys) {
    const info = S.conns.get(peerId);
    switch (d.sys) {
      case 'hello': {
        if (info) { info.nickname = d.nickname || '成员'; info.host = !!d.host; }
        if (S.isHost) {
          // 房主下发在线成员列表，供新成员建立网状连接
          const list = [...S.conns.entries()].filter(([id]) => id !== peerId).map(([id, o]) => ({ id, nickname: o.nickname }));
          send(info && info.conn, { sys: 'peers', list });
        }
        if (S.roster.has(peerId)) S.roster.delete(peerId);
        else sysMsg(`${d.nickname} 加入了房间`);
        renderUsers();
        break;
      }
      case 'peers':
        (d.list || []).forEach(p => { S.roster.add(p.id); connectTo(p.id); });
        break;
      case 'voice':
        if (info) { info.voice = { active: !!d.active, muted: !!d.muted }; if (!d.active) info.speaking = false; }
        renderUsers();
        break;
      case 'stageLink':
        openStageLink(d.url, d.mode, d.embed, peerId, d.nickname, false);
        break;
      case 'stageClose':
        if (S.stage.owner === peerId) clearStage(true);
        break;
      case 'sync':
        applySync(peerId, d);
        break;
      case 'bye':
        dropPeer(peerId);
        break;
    }
    return;
  }
  if (d.type === 'file-meta' || d.type === 'file-chunk' || d.type === 'file-done') { handleFileMsg(peerId, d); return; }
  renderMsg(d, false);
}

/* ---------------- 视频链接识别 ---------------- */
function parseVideo(url) {
  const u = url.trim();
  if (!/^https?:\/\//i.test(u)) return null;
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/i)))
    return { mode: 'frame', src: 'YouTube', embed: `https://www.youtube.com/embed/${m[1]}?rel=0` };
  if ((m = u.match(/bilibili\.com\/video\/(BV[\w]+)/i)))
    return { mode: 'frame', src: 'B站', embed: `https://player.bilibili.com/player.html?bvid=${m[1]}&page=1&high_quality=1&danmaku=0&autoplay=0` };
  if ((m = u.match(/bilibili\.com\/video\/av(\d+)/i)))
    return { mode: 'frame', src: 'B站', embed: `https://player.bilibili.com/player.html?aid=${m[1]}&page=1&high_quality=1&danmaku=0&autoplay=0` };
  if ((m = u.match(/b23\.tv\/([\w]+)/i)))
    return { mode: 'link', src: 'B站短链', embed: u };
  if (/(?:vimeo\.com\/)(\d+)/i.test(u))
    return { mode: 'frame', src: 'Vimeo', embed: 'https://player.vimeo.com/video/' + u.match(/vimeo\.com\/(\d+)/i)[1] };
  if (/\.(mp3|wav|oga|ogg|m4a|aac|flac|opus|weba)(\?|#|$)/i.test(u))
    return { mode: 'audio', src: '音频直链', embed: u };
  if (/\.(mp4|webm|ogv|m4v|mov)(\?|#|$)/i.test(u))
    return { mode: 'video', src: '直链视频', embed: u };
  if (/\.(m3u8)(\?|#|$)/i.test(u))
    return { mode: 'video', src: 'HLS 流', embed: u };
  return null;
}
function videoCard(url, meta) {
  const mode = meta.mode || 'video';
  const src = esc(meta.src || '视频');
  const embed = meta.embed || url;
  const player = mode === 'frame'
    ? `<iframe src="${esc(embed)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen scrolling="no" referrerpolicy="no-referrer"></iframe>`
    : `<video data-src="${esc(embed)}" controls playsinline preload="metadata"></video>`;
  return `<div class="vcard">${player}
    <div class="ft"><span class="src">${src}</span><span class="u">${esc(url)}</span>
    <button data-push="${esc(url)}" data-mode="${mode}" data-embed="${esc(embed)}">推到共享区</button></div>
  </div>`;
}
function audioCard(url, meta) {
  const src = esc(meta.src || '音频');
  const embed = meta.embed || url;
  return `<div class="vcard" style="max-width:340px">
    <audio data-src="${esc(embed)}" controls preload="metadata"></audio>
    <div class="ft"><span class="src">${src}</span><span class="u">${esc(url)}</span></div>
  </div>`;
}

/* 媒体播放器挂载：原生 video/audio + HLS(m3u8) 走 hls.js */
function isHls(url) { return /\.m3u8(\?|#|$)/i.test(url || ''); }
function attachHls(v, url) {
  const h = new Hls({ enableWorker: true });
  h.loadSource(url);
  h.attachMedia(v);
  h.on(Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => { }); });
  h.on(Hls.Events.ERROR, (_, e) => { if (e && e.fatal) { console.warn('hls fatal', e); h.destroy(); v.src = url; } });
}
function initMedia(el) {
  const url = el.dataset.src;
  if (!url) return;
  if (el.tagName === 'VIDEO' && isHls(url)) {
    if (window.Hls && Hls.isSupported()) { attachHls(el, url); }
    else if (el.canPlayType('application/vnd.apple.mpegurl')) { el.src = url; }
    else {
      ensureLib('hls').then(() => { if (window.Hls && Hls.isSupported()) attachHls(el, url); else el.src = url; })
        .catch(() => { el.src = url; });
    }
  } else { el.src = url; }
}

/* ---------------- 图片发送 ---------------- */
$('#imgBtn').onclick = () => $('#filePick').click();
$('#filePick').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const dataUrl = await shrinkImage(f, 1440, .8);
    emit({ type: 'image', content: dataUrl });
  } catch (err) { toast('图片处理失败：' + err.message, 'err'); }
};
function shrinkImage(file, maxDim, q) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('读取失败'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('解析失败'));
      img.onload = () => {
        let { width: w, height: h } = img;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        if (scale === 1 && fr.result.length < 260000) return res(fr.result);
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
// 粘贴图片直接发送
document.addEventListener('paste', async e => {
  if (!S.entered) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {

      const f = it.getAsFile();
      if (f) { e.preventDefault(); try { emit({ type: 'image', content: await shrinkImage(f, 1440, .8) }); } catch (err) { } }
      return;
    }
  }
});

/* ---------------- 媒体：统一外呼 ---------------- */
function callPeer(peerId, kind) {
  const stream = kind === 'voice' ? S.voiceStream : S.shareStream;
  if (!stream) return;
  const map = kind === 'voice' ? S.voiceCalls : S.shareCalls;
  if (map.has(peerId)) return;
  try {
    const call = S.peer.call(peerId, stream, { metadata: { kind, nickname: S.nickname } });
    map.set(peerId, call);
    call.on('close', () => map.delete(peerId));
    call.on('error', () => map.delete(peerId));
  } catch (e) { console.warn('call fail', e); }
}
function callAll(kind) { S.conns.forEach((_, id) => callPeer(id, kind)); }
function hangAll(kind) {
  const map = kind === 'voice' ? S.voiceCalls : S.shareCalls;
  map.forEach(c => { try { c.close(); } catch (e) { } });
  map.clear();
}

/* 接收来电（只收不回，各方向独立） */
function handleCall(call) {
  const kind = (call.metadata && call.metadata.kind) || 'voice';
  const nick = (call.metadata && call.metadata.nickname) || (S.conns.get(call.peer) || {}).nickname || '成员';
  try { call.answer(); } catch (e) { return; }
  call.on('stream', stream => {
    if (kind === 'voice') attachAudio(call.peer, stream);
    else if (kind === 'share') showP2PStage(call.peer, stream, nick);
  });
  call.on('close', () => {
    if (kind === 'voice') { removeAudio(call.peer); stopDetector(call.peer); }
    else if (kind === 'share' && S.stage.owner === call.peer) clearStage(true);
  });
  call.on('error', e => console.warn('incoming call error', e));
}

$('#micBtn').onclick = () => { S.voiceStream ? stopVoice() : startVoice(); };

async function startVoice() {

function stopVoice() {

  S.voiceMuted = false;

function toggleMute() {

function attachAudio(peerId, stream) {
  removeAudio(peerId);
  const a = document.createElement('audio');
  a.autoplay = true;
  a.playsInline = true;
  a.srcObject = stream;
  $('#audioSink').appendChild(a);
  a.play().catch(() => toast('浏览器拦截了自动播放，点击页面任意处即可听到语音', 'warn', 5000));
  S.audios.set(peerId, a);
  startDetector(peerId, stream, sp => {
    const info = S.conns.get(peerId);
    if (info && info.speaking !== sp) { info.speaking = sp; renderUsers(); }
  });
}
function removeAudio(peerId) {
  const a = S.audios.get(peerId);
  if (a) { try { a.srcObject = null; a.remove(); } catch (e) { } S.audios.delete(peerId); }
}

/* 说话检测（本地分析，不额外占用数据通道） */
function startDetector(key, stream, cb) {
  stopDetector(key);
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !stream.getAudioTracks().length) return;
    const ctx = new AC();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 512;
    an.smoothingTimeConstant = .75;
    src.connect(an);
    const buf = new Uint8Array(an.frequencyBinCount);
    let raf, speaking = false, quiet = 0;
    const loop = () => {
      an.getByteFrequencyData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i];
      const avg = sum / buf.length;
      if (avg > 12) { quiet = 0; if (!speaking) { speaking = true; cb(true); } }
      else if (speaking && ++quiet > 22) { speaking = false; cb(false); }
      raf = requestAnimationFrame(loop);
    };
    loop();
    S.detectors.set(key, () => { cancelAnimationFrame(raf); try { src.disconnect(); ctx.close(); } catch (e) { } if (speaking) cb(false); });
  } catch (e) { console.warn('detector fail', e); }
}
function stopDetector(key) { const f = S.detectors.get(key); if (f) { f(); S.detectors.delete(key); } }

/* ---------------- 本地视频 P2P 共享 ---------------- */
$('#shareBtn').onclick = () => { S.shareStream ? stopShare() : $('#videoPick').click(); };

async function startShare(file) {
  const v = $('#stageVideo');
  clearStage(false);
  try {
    if (S.shareObjUrl) URL.revokeObjectURL(S.shareObjUrl);
    S.shareObjUrl = URL.createObjectURL(file);
    $('#stage').classList.remove('frame');
    $('#stage').classList.add('on');
    v.srcObject = null;
    v.src = S.shareObjUrl;
    v.muted = false;
    v.controls = true;
    $('#stageWho').textContent = `你正在共享：${file.name}`;
    $('#stageLive').style.display = '';
    $('#stageSync').style.display = 'none';
    S.stage = { owner: S.myId, mode: 'p2p', url: '' };

    await new Promise((res, rej) => {
      let done = false;
      v.onloadedmetadata = () => { done = true; res(); };
      v.onerror = () => rej(new Error('该视频格式浏览器无法解码，建议使用 MP4(H.264) / WebM'));
      setTimeout(() => { if (!done) rej(new Error('视频加载超时')); }, 12000);
    });
    await v.play().catch(() => { });

    const cap = v.captureStream || v.mozCaptureStream;
    if (!cap) throw new Error('当前浏览器不支持 captureStream，建议使用 Chrome / Edge');
    const stream = cap.call(v);
    S.shareStream = stream;
    callAll('share');
    $('#shareBtn').classList.add('active', 'danger');
    $('#shareBtn').title = '停止共享';
    toast('已开始共享本地视频，房间成员将实时看到画面', 'ok', 4000);
    v.onended = () => { toast('视频播放结束', 'info'); };
  } catch (err) {
    toast(err.message || '共享失败', 'err', 5000);
    stopShare();
  }
}
function stopShare() {
  hangAll('share');
  if (S.shareStream) { S.shareStream.getTracks().forEach(t => { try { t.stop(); } catch (e) { } }); S.shareStream = null; }
  $('#shareBtn').classList.remove('active', 'danger');
  $('#shareBtn').title = '共享本地视频（P2P 推流）';
  if (S.stage.owner === S.myId && S.stage.mode === 'p2p') clearStage(true);
}

/* ---------------- 共享区：视频链接 ---------------- */
function pushToStage(url, mode, embed) {
  openStageLink(url, mode, embed, S.myId, S.nickname, true);
  broadcast({ sys: 'stageLink', url, mode, embed, nickname: S.nickname });
  toast('已推送到共享区，所有成员同步打开', 'ok');
}
function openStageLink(url, mode, embed, ownerId, nick, isMine) {
  clearStage(false);
  const stage = $('#stage');
  stage.classList.add('on');
  S.stage = { owner: ownerId, mode: mode || 'video', url, embed };
  $('#stageLive').style.display = 'none';
  if (mode === 'frame') {
    stage.classList.add('frame');
    $('#stageFrame').src = embed;
    $('#stageSync').style.display = 'none';
  } else {
    stage.classList.remove('frame');
    const v = $('#stageVideo');
    v.srcObject = null;
    if (isHls(embed)) attachHls(v, embed); else v.src = embed;
    v.muted = false;
    v.controls = true;
    $('#stageSync').style.display = isMine ? '' : 'none';
    if (isMine) bindSyncSource(v);
  }
  $('#stageWho').textContent = (isMine ? '你' : nick) + ' 推送到共享区';
  if (!isMine) sysMsg(`${nick} 把一个视频推送到了共享区`);
}
function bindSyncSource(v) {
  const push = action => {
    if (S.stage.owner !== S.myId) return;
    broadcast({ sys: 'sync', action, time: v.currentTime });
  };
  v.onplay = () => push('play');
  v.onpause = () => push('pause');
  v.onseeked = () => push('seek');
}
$('#stageSync').onclick = () => {
  const v = $('#stageVideo');
  broadcast({ sys: 'sync', action: v.paused ? 'pause' : 'play', time: v.currentTime });
  toast('已同步当前播放进度给所有成员', 'ok', 2000);
};
function applySync(peerId, d) {
  if (S.stage.owner !== peerId || S.stage.mode === 'frame' || S.stage.mode === 'p2p') return;
  const v = $('#stageVideo');
  if (Date.now() - S.syncLock < 250) return;
  S.syncLock = Date.now();
  if (typeof d.time === 'number' && Math.abs(v.currentTime - d.time) > 0.6) v.currentTime = d.time;
  if (d.action === 'play') v.play().catch(() => { });
  if (d.action === 'pause') v.pause();
}

$('#stageClose').onclick = () => {
  const mine = S.stage.owner === S.myId;
  if (mine && S.stage.mode === 'p2p') { stopShare(); return; }
  if (mine) broadcast({ sys: 'stageClose' });

};
function clearStage(hide) {
  const v = $('#stageVideo');
  try { v.pause(); } catch (e) { }

    $('#stage').classList.remove('on', 'frame');
    S.stage = { owner: null, mode: null, url: '' };

  }
}

/* ================== 文件共享（点对点分片直传） ================== */
const IMG_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'avif'];
const AUD_EXTS = ['mp3', 'wav', 'ogg', 'oga', 'm4a', 'aac', 'flac', 'opus', 'weba'];
const MOV_EXTS = ['mp4', 'webm', 'ogv', 'm4v', 'mov', 'm3u8'];

$('#fileBtn').onclick = () => $('#filePickAll').click();
$('#filePickAll').onchange = async e => {
  const files = [...(e.target.files || [])];
  e.target.value = '';
  for (const f of files) await sendFileToAll(f);
};

async function sendFileToAll(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const fileId = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const objectUrl = URL.createObjectURL(file);
  const entry = {
    fileId, name: file.name, size: file.size, mime: file.type || '', ext,
    senderId: S.myId, nickname: S.nickname, time: Date.now(),
    objectUrl, isSelf: true, chunks: null, received: file.size, total: file.size, done: false, el: null
  };
  S.transfers.set(fileId, entry);
  mountFileCard(entry);
  scrollBottom(true);

  broadcast({ type: 'file-meta', fileId, name: file.name, size: file.size, mime: file.type || '', ext, senderId: S.myId, nickname: S.nickname, time: entry.time });

  const peers = [...S.conns.values()].map(o => o.conn);
  if (peers.length === 0) { entry.done = true; updateFileCard(entry); return; }
  const CHUNK = 16 * 1024;
  toast('正在分发文件：' + file.name, 'info', 2600);
  try {
    for (const conn of peers) {
      let off = 0;
      while (off < file.size) {
        const end = Math.min(off + CHUNK, file.size);
        const buf = await file.slice(off, end).arrayBuffer();
        await waitDrain(conn);
        send(conn, { type: 'file-chunk', fileId, index: (off / CHUNK) | 0, data: buf });
        off = end;
      }
    }
    broadcast({ type: 'file-done', fileId });
    entry.done = true;
    updateFileCard(entry);
    toast('文件已送达全部成员', 'ok', 2600);
  } catch (err) {
    toast('文件发送失败：' + (err.message || err), 'err', 5000);
  }
}

function waitDrain(conn) {
  return new Promise(res => {
    const dc = conn.dataChannel;
    if (dc && typeof dc.bufferedAmount === 'number' && dc.bufferedAmount > 1024 * 1024 && dc.bufferedAmountLowThreshold !== undefined) {
      dc.bufferedAmountLowThreshold = 512 * 1024;
      const h = () => { dc.removeEventListener('bufferedamountlow', h); res(); };
      dc.addEventListener('bufferedamountlow', h);
    } else res();
  });
}

function handleFileMsg(peerId, d) {
  if (d.type === 'file-meta') {
    if (S.transfers.has(d.fileId)) return;
    const entry = {
      fileId: d.fileId, name: d.name, size: d.size, mime: d.mime, ext: (d.ext || '').toLowerCase(),
      senderId: d.senderId, nickname: d.nickname || '成员', time: d.time,
      objectUrl: null, isSelf: false, chunks: new Map(), received: 0, total: d.size, done: false, el: null
    };
    S.transfers.set(d.fileId, entry);
    mountFileCard(entry);
    scrollBottom(false);
  } else if (d.type === 'file-chunk') {
    const e = S.transfers.get(d.fileId);
    if (!e || e.done) return;
    const buf = d.data instanceof ArrayBuffer ? d.data : (d.data && d.data.buffer) || d.data;
    if (!e.chunks.has(d.index)) {
      e.chunks.set(d.index, buf);
      e.received += (buf.byteLength != null ? buf.byteLength : (buf.length || 0));
    }
    if (e.total > 0) updateFileCard(e);
  } else if (d.type === 'file-done') {
    const e = S.transfers.get(d.fileId);
    if (!e || e.done) return;
    try {
      const keys = [...e.chunks.keys()].sort((a, b) => a - b);
      const parts = keys.map(k => e.chunks.get(k));
      const blob = new Blob(parts, { type: e.mime || '' });
      e.objectUrl = URL.createObjectURL(blob);
      e.done = true;
      updateFileCard(e);
    } catch (err) {
      toast('文件接收失败：' + (err.message || err), 'err', 5000);
    }
  }
}

function fileIcon(ext) {
  if (IMG_EXTS.includes(ext)) return ['🖼️', '图片'];
  if (AUD_EXTS.includes(ext)) return ['🎵', '音频'];
  if (MOV_EXTS.includes(ext)) return ['🎬', '视频'];
  if (['doc', 'docx'].includes(ext)) return ['📝', 'Word'];
  if (['xls', 'xlsx'].includes(ext)) return ['📊', 'Excel'];
  if (['ppt', 'pptx'].includes(ext)) return ['📽️', 'PPT'];
  if (ext === 'xmind') return ['🧠', 'XMind'];
  if (ext === 'pdf') return ['📕', 'PDF'];
  return ['📎', '文件'];
}
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function pct(e) { return e.total ? Math.min(100, Math.round(e.received / e.total * 100)) : (e.done ? 100 : 0); }

function mountFileCard(entry) {
  const row = document.createElement('div');
  row.className = 'row' + (entry.isSelf ? ' me' : '');
  const [ico, kind] = fileIcon(entry.ext);
  const initial = esc((entry.nickname || '?').charAt(0).toUpperCase());
  row.innerHTML = `
    <div class="avatar" style="background:${colorOf(entry.senderId || entry.nickname)}">${initial}</div>
    <div class="bd">
      <div class="mhd"><span class="nm">${esc(entry.nickname)}</span><span class="tm">${fmtTime(entry.time || Date.now())}</span></div>
      <div class="bub plain">
        <div class="fcard">
          <div class="f-ico">${ico}</div>
          <div class="f-meta">
            <div class="f-name" title="${esc(entry.name)}">${esc(entry.name)}</div>
            <div class="f-sub"><span class="f-kind">${kind}</span> · <span class="f-size">${fmtSize(entry.size)}</span></div>
            <div class="f-prog" style="display:${entry.done || entry.isSelf ? 'none' : 'block'}">
              <div class="f-bar"><i style="width:${pct(entry)}%"></i></div>
              <span class="f-pct">${entry.isSelf ? '分发中…' : pct(entry) + '%'}</span>
            </div>
          </div>
          <div class="f-acts">
            <button class="f-prev" ${entry.objectUrl ? '' : 'disabled'}>预览</button>
            <a class="f-dl" href="${entry.objectUrl || ''}" download="${esc(entry.name)}" ${entry.objectUrl ? '' : 'style="pointer-events:none;opacity:.4"'}>下载</a>
          </div>
        </div>
      </div>
    </div>`;
  $('#msgs').appendChild(row);
  entry.el = row;
  row.querySelector('.f-prev').onclick = () => openPreview(entry);
  if (IMG_EXTS.includes(entry.ext) && entry.objectUrl) {
    const im = document.createElement('img');
    im.className = 'f-thumb'; im.src = entry.objectUrl; im.onclick = () => openPreview(entry);
    row.querySelector('.fcard').appendChild(im);
  }
}
function updateFileCard(entry) {
  if (!entry.el) return;
  const bar = entry.el.querySelector('.f-prog');
  const prev = entry.el.querySelector('.f-prev');
  const dl = entry.el.querySelector('.f-dl');
  if (entry.done) {
    if (bar) bar.style.display = 'none';
    if (prev) prev.disabled = false;
    if (dl) { dl.href = entry.objectUrl || ''; dl.style.pointerEvents = ''; dl.style.opacity = ''; }
    if (IMG_EXTS.includes(entry.ext) && entry.objectUrl && !entry.el.querySelector('.f-thumb')) {
      const im = document.createElement('img');
      im.className = 'f-thumb'; im.src = entry.objectUrl; im.onclick = () => openPreview(entry);
      entry.el.querySelector('.fcard').appendChild(im);
    }
  } else if (bar) {
    bar.style.display = 'block';
    const i = bar.querySelector('i'); if (i) i.style.width = pct(entry) + '%';
    const p = bar.querySelector('.f-pct'); if (p) p.textContent = (entry.isSelf ? '已发送' : pct(entry) + '%');
  }
}

/* ================== 文件预览（在线查看） ================== */
$('#pmClose').onclick = () => $('#previewModal').classList.remove('on');
$('#previewModal').onclick = e => { if (e.target === $('#previewModal')) $('#previewModal').classList.remove('on'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#previewModal').classList.remove('on'); });

async function openPreview(entry) {
  const url = entry.objectUrl;
  if (!url) return;
  $('#pmName').textContent = entry.name;
  const dl = $('#pmDownload'); dl.href = url; dl.download = entry.name;
  const body = $('#pmBody');
  body.innerHTML = '<div class="pm-loading">正在加载预览…</div>';
  $('#previewModal').classList.add('on');
  const ext = entry.ext.toLowerCase();
  try {
    if (IMG_EXTS.includes(ext)) {
      body.innerHTML = ''; const img = new Image(); img.src = url; img.className = 'pm-img'; body.appendChild(img);
    } else if (AUD_EXTS.includes(ext)) {
      body.innerHTML = ''; const a = document.createElement('audio'); a.src = url; a.controls = true; a.className = 'pm-media'; body.appendChild(a); a.play().catch(() => { });
    } else if (MOV_EXTS.includes(ext)) {
      body.innerHTML = ''; const v = document.createElement('video'); v.src = url; v.controls = true; v.className = 'pm-media'; body.appendChild(v); v.play().catch(() => { });
    } else if (ext === 'docx' || ext === 'doc') {
      await ensureLib('mammoth');
      const buf = await (await fetch(url)).arrayBuffer();
      const r = await mammoth.convertToHtml({ arrayBuffer: buf });
      body.innerHTML = '<div class="pm-doc">' + (r.value || '<p style="color:#999">文档无可提取内容</p>') + '</div>';
    } else if (ext === 'xlsx' || ext === 'xls') {
      await ensureLib('xlsx');
      const buf = await (await fetch(url)).arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      body.innerHTML = renderSheets(wb);
    } else if (ext === 'pptx' || ext === 'ppt') {
      await ensureLib('jszip');
      const buf = await (await fetch(url)).arrayBuffer();
      body.innerHTML = await renderPptx(buf);
    } else if (ext === 'xmind') {
      await ensureLib('jszip');
      const buf = await (await fetch(url)).arrayBuffer();
      body.innerHTML = await renderXmind(buf);
    } else {
      body.innerHTML = `<div class="pm-note">该格式暂不支持在线预览，请点击右上角「下载」后查看。<br><a href="${url}" download="${esc(entry.name)}">下载文件</a></div>`;
    }
  } catch (e) {
    body.innerHTML = `<div class="pm-note">预览失败：${esc(e.message || e)}</div>`;
  }
}
function renderSheets(wb) {
  const names = wb.SheetNames || [];
  if (!names.length) return '<div class="pm-note">工作簿为空</div>';
  let h = '';
  for (const nm of names) {
    const html = XLSX.utils.sheet_to_html(wb.Sheets[nm]);
    h += `<div class="sh"><div class="sh-nm">${esc(nm)}</div><div class="sh-tbl">${html}</div></div>`;
  }
  return h;
}
async function renderPptx(buf) {
  let zip;
  try { zip = await JSZip.loadAsync(buf); } catch (e) { return '<div class="pm-note">无法读取该 PPT（可能为旧版 .ppt 二进制格式，请下载后用 PowerPoint/WPS 打开）</div>'; }
  const names = Object.keys(zip.files).filter(n => /ppt\/slides\/slide\d+\.xml$/i.test(n));
  names.sort((a, b) => (+((a.match(/slide(\d+)/i) || [])[1]) || 0) - (+((b.match(/slide(\d+)/i) || [])[1]) || 0));
  if (!names.length) return '<div class="pm-note">未找到可提取的幻灯片内容（可能为旧版 .ppt，请下载后查看）</div>';
  let h = '', i = 1;
  for (const n of names) {
    const xml = await zip.file(n).async('string');
    const texts = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]).filter(t => t.trim());
    h += `<div class="slide"><div class="slide-n">幻灯片 ${i++}</div><div class="slide-body">${texts.map(t => `<p>${esc(t)}</p>`).join('') || '<p class="pm-note">(本页无可提取文字)</p>'}</div></div>`;
  }
  return h;
}
async function renderXmind(buf) {
  let zip;
  try { zip = await JSZip.loadAsync(buf); } catch (e) { return '<div class="pm-note">无法读取该 XMind 文件</div>'; }
  if (zip.file('content.json')) {
    try { return xmindFromJson(JSON.parse(await zip.file('content.json').async('string'))); } catch (e) { }
  }
  if (zip.file('content.xml')) {
    try { return xmindFromXml(await zip.file('content.xml').async('string')); } catch (e) { }
  }
  return '<div class="pm-note">未识别的思维导图内容</div>';
}
function xmindFromJson(json) {
  const sheets = Array.isArray(json) ? json : [json];
  let html = '';
  for (const sh of sheets) {
    const root = sh.rootTopic || sh;
    html += `<div class="xm-sheet"><div class="xm-root">${xmindTopic(root)}</div></div>`;
  }
  return html || '<div class="pm-note">思维导图为空</div>';
}
function xmindTopic(t) {
  if (!t) return '';
  const title = esc(t.title || '');
  let list = [];
  if (t.children) {
    if (Array.isArray(t.children)) list = t.children;
    else if (t.children.attached) list = t.children.attached;
    else if (t.children.detached) list = t.children.detached;
  }
  const inner = list.map(x => xmindTopic(x)).join('');
  return `<div class="xm-node"><span class="xm-t">${title}</span>${inner ? `<div class="xm-ch">${inner}</div>` : ''}</div>`;
}
function xmindFromXml(xmlStr) {
  const doc = new DOMParser().parseFromString(xmlStr, 'text/xml');
  const sheets = [...doc.getElementsByTagName('sheet')];
  let html = '';
  sheets.forEach(sh => {
    const central = sh.querySelector('topic[central="true"]') || sh.querySelector('topic');
    html += `<div class="xm-sheet"><div class="xm-root">${xmlTopic(central)}</div></div>`;
  });
  return html || '<div class="pm-note">无法解析思维导图</div>';
}
function xmlTopic(t) {
  if (!t) return '';
  const titleEl = t.querySelector(':scope > title');
  const title = esc(titleEl ? titleEl.textContent : '');
  const topics = t.querySelector(':scope > children > topics[type="attached"]');
  let inner = '';
  if (topics) [...topics.children].forEach(c => { inner += xmlTopic(c); });
  return `<div class="xm-node"><span class="xm-t">${title}</span>${inner ? `<div class="xm-ch">${inner}</div>` : ''}</div>`;
}
